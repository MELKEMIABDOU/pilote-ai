[project]
name = "copilote-adv"
version = "0.1.0"
description = "Copilote de pré-traitement et de validation de bons de commande ADV"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy>=2.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
rag = [
    "docling>=2.0.0",
    "transformers>=4.51.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.16.2",
    "mypy>=1.10.0",
    "pre-commit>=3.7.0",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[tool.ruff]
# Longueur de ligne standard
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# E / W: Pycodestyle (erreurs et warnings standards)
# F: Pyflakes (imports inutilisés, variables non définies)
# I: isort (tri automatique et propre des imports)
# B: flake8-bugbear (détection de pièges et bugs fréquents)
# UP: pyupgrade (modernisation automatique de la syntaxe Python)
# SIM: simplifications, PT: bonnes pratiques pytest
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PT"]
ignore = []

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
# Les tests d'intégration (vrai Docling, lents) sont exclus par défaut : `pytest -m integration`.
addopts = "-v --strict-markers -m 'not integration'"
markers = ["integration: tests lents qui utilisent les vraies dépendances (Docling...)"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# Dépendances optionnelles (extra `rag`), absentes en CI.
module = ["docling.*", "docling_core.*", "transformers.*", "torch.*"]
ignore_missing_imports = true
